<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Árbol familiar</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,50;1,9..144,300..600,50&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/arbol.css">
<style>
  body { overflow: auto; display: grid; place-items: center; min-height: 100%; padding: 40px 16px; }
  main { max-width: 640px; }
  h1 { font-family: var(--serif); font-weight: 350; font-size: clamp(36px, 7vw, 60px); letter-spacing: -.02em; margin: 0 0 12px; line-height: 1; }
  p { color: var(--tinta-2); line-height: 1.6; }
  .opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 28px; }
  .opciones a { display: block; padding: 22px; border: 1px solid var(--borde); border-radius: 18px; background: var(--tarjeta); color: inherit; text-decoration: none; transition: transform .3s var(--ease), box-shadow .3s; }
  .opciones a:hover { transform: translateY(-3px); box-shadow: var(--sombra); }
  .opciones b { font-family: var(--serif); font-weight: 450; font-size: 22px; display: block; margin-bottom: 6px; }
  .opciones span { color: var(--tinta-2); font-size: 14px; }
  @media (max-width: 560px) { .opciones { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Familia Azuara <em style="font-weight:300">&amp;</em> Hernández de la Cajiga</h1>
  <p>Dos versiones del mismo árbol. Escoge con cuál quedarte.</p>
  <div class="opciones">
    <a href="con-fotos.html"><b>Con fotos</b><span>Cada persona tiene un espacio para su retrato.</span></a>
    <a href="./"><b>Sin fotos</b><span>Placas tipográficas, más compactas.</span></a>
  </div>
</main>
</body>
</html>
